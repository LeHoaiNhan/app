# Render.com one-click deploy.
# 1. Push this repo to GitHub.
# 2. Go to https://dashboard.render.com/blueprints → New Blueprint → pick this repo.
# 3. Render reads this file, creates the web service + Postgres, prompts you for the env vars below.
# 4. After first deploy, open the Shell tab and run: npm run db:seed
services:
  - type: web
    name: evisa-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: evisa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://lehoainhan.github.io
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com

databases:
  - name: evisa-db
    plan: free
    databaseName: evisa
    user: evisa
