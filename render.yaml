# Render.com one-click deploy via Blueprint.
# 1. Push this repo to GitHub.
# 2. https://dashboard.render.com/blueprints -> New Blueprint -> pick this repo.
# 3. Render reads this file, creates the web service + Postgres, asks for the env vars.
# 4. After first deploy, open the Shell tab and run: npm run db:seed:prod
services:
  - type: web
    name: evisa-api
    runtime: node
    rootDir: server
    plan: free
    healthCheckPath: /health
    # Build only installs deps + generates Prisma client (no DB needed at build time).
    buildCommand: npm install && npx prisma generate
    # Migrations run at startup with DATABASE_URL available; idempotent.
    startCommand: npx prisma migrate deploy && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: evisa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://lehoainhan.github.io
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com

databases:
  - name: evisa-db
    plan: free
    databaseName: evisa
    user: evisa
