services:
  postgres:
    image: postgres:16-alpine
    container_name: evisa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evisa
      POSTGRES_PASSWORD: evisa
      POSTGRES_DB: evisa
    ports:
      - "5432:5432"
    volumes:
      - evisa_pg_data:/var/lib/postgresql/data

volumes:
  evisa_pg_data:
